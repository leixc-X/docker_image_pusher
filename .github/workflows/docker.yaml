name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  # 可选:配了 Docker Hub 凭据后走认证拉取,规避匿名 100次/6小时 限流(经常拉取建议配)
  DOCKERHUB_USERNAME: "${{ secrets.DOCKERHUB_USERNAME }}"
  DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 1024
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-haskell: 'true'
        remove-android: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Restart docker
      run: sudo service docker restart

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Ensure skopeo
      run: |
        if ! command -v skopeo; then sudo apt-get update && sudo apt-get install -y skopeo; fi
        skopeo --version
        sudo mkdir -p /var/lib/docker/tmp && sudo chmod 1777 /var/lib/docker/tmp

    - name: Copy images to Aliyun (registry-to-registry, no local pull)
      env:
        # skopeo 逐层流转时的临时目录放到扩出来的大挂载上
        TMPDIR: /var/lib/docker/tmp
      run: |
        set -e
        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                temp_map[$image_name]=$name_space
            fi
        done < images.txt

        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
                platform_prefix=""
                os=linux; arch=amd64
            else
                platform_prefix="${platform//\//_}_"
                os=${platform%%/*}; arch=${platform##*/}
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            # 无 registry 前缀的补 docker.io
            first=$(echo "$image" | awk -F'/' '{print $1}')
            if echo "$first" | grep -q '[.:]'; then
                src="docker://$image"
            else
                src="docker://docker.io/$image"
            fi

            # skopeo 注册表到注册表直传,镜像不在本地完整落盘,再大也不撑爆磁盘
            # 源若是私库,加: --src-creds "用户:密码"
            # 想复制全部架构而不是单架构,把 override 换成 --all
            src_creds=""
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
                src_creds="--src-creds=$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN"
            fi
            echo "skopeo copy $src -> docker://$new_image ($os/$arch)"
            skopeo copy --retry-times 3 --override-os "$os" --override-arch "$arch" \
                $src_creds "$src" "docker://$new_image" \
                --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD"
            echo "done: $new_image"
            echo "=============================================================================="
            df -hT
            echo "=============================================================================="

        done < images.txt
